# Kallisti: the Kallisti server (web app, voice with its built-in Mumble
# server, text channels) and Caddy for HTTPS. Set DOMAIN (for example in
# deploy/.env), then:
#   docker compose -f deploy/compose.yml up -d
services:
  kallisti:
    build: ..
    restart: unless-stopped
    ports:
      - "64738:64738/tcp" # Mumble clients and the Kallisti desktop app
      - "64738:64738/udp"
      - "8189:8189/udp" # streams from OBS (WHIP)
    environment:
      ALLOWED_ORIGINS: "https://${DOMAIN}"
      TRUST_FORWARDED_FOR: "1" # Caddy sets X-Forwarded-For
      TEXT_CHANNELS: "general"
      SERVER_NAME: "${SERVER_NAME:-Kallisti}"
      MUMBLE_WELCOME: "${MUMBLE_WELCOME:-}"
      # The Mumble admin (log in as SuperUser with a Mumble client). Unset:
      # keep the password from an earlier start.
      MUMBLED_SUPERUSER_PASSWORD: "${SUPERUSER_PASSWORD:-}"
      BACKUP_DIR: "/data/backups" # daily database backups, the newest 7 kept
      # A certificate for the Mumble port (see docs/configuration.md), for example copied
      # from the proxy into the data volume. Unset: self-signed.
      MUMBLE_CERT_FILE: "${MUMBLE_CERT_FILE:-}"
      MUMBLE_KEY_FILE: "${MUMBLE_KEY_FILE:-}"
      # Streams from OBS: the UDP port above, and the address OBS reaches it
      # at (the container does not know it). Behind Cloudflare's proxy, set
      # WHIP_PUBLIC_IP to the server's IPv4 address.
      WHIP_UDP_PORT: "8189"
      WHIP_PUBLIC_IP: "${WHIP_PUBLIC_IP:-${DOMAIN}}"
    volumes:
      - kallisti-data:/data # database, uploads, server certificate

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kallisti

volumes:
  kallisti-data:
  caddy-data:
  caddy-config:
