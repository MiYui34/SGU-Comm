name: helm chart

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint deploy/kubernetes/chart -f deploy/kubernetes/chart/ci/values.yaml --strict
      - run: python tests/deploy/helm_chart.py
